# @package _global_
defaults:
  - /train_turn_indicator/dataloader@dataloader: default
  - /train_turn_indicator/model@model: default
  - /train_turn_indicator/optimizer@optimizer: default
  - /train_turn_indicator/scheduler@scheduler: default
  - _self_

seed: 42
experiment_name: ???

training:
  total_epochs: 5
  cpu: false
  mixed_precision: bf16
  compile: true
  compile_backend: inductor
  max_grad_norm: 1.0
  transition_loss_weight: 100.0
  log_interval: 200
  checkpoint_dir: checkpoints/turn_indicator
  resume_from: null
  warm_start: false
