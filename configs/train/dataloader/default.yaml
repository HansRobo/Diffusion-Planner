# The dataset is nested here rather than being its own group: it exists only to feed this
# loader, and Hydra instantiates it recursively when the loader is built.
_target_: diffusion_planner.data.build_dataloader
dataset:
  # H5 frame index written by scripts/dataset/create_h5_dataset.py.
  _target_: diffusion_planner.data.PlannerDataset
  parquet_path: ???
  file_capacity: 8
batch_size: 32
shuffle: true
# Each worker owns its own small LRU cache of read-only H5 handles.
num_workers: 8
