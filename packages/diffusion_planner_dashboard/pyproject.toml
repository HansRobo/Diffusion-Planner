[project]
name = "diffusion-planner-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for diffusion planner frame data"
requires-python = ">=3.10"
dependencies = [
    "diffusion-planner",
    "h5py>=3.16.0",
    "hdf5plugin>=7.0.0",
    "numpy>=2.2.6",
    "pyarrow>=25.0.0",
    "streamlit>=1.48.0",
]

[project.scripts]
diffusion-planner-dashboard = "diffusion_planner_dashboard.cli:main"

[tool.uv.sources]
diffusion-planner = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
