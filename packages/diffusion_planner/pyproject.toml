[project]
name = "diffusion-planner"
version = "0.1.0"
description = "Model and visualization library for diffusion planner"
requires-python = ">=3.10"
dependencies = [
    "argcomplete>=3.7.0",
    "numpy>=2.2.6",
    "plotly>=6.9.0",
    "pyarrow>=25.0.0",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
